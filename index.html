<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChemBuild Preview</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f2f3f6;color:#20222a;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.top{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:20}.logo{font-weight:800;font-size:18px}.logo b{color:#6c55df}.center{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;font-size:12px}.pill{background:#f4f3f8;padding:7px 13px;border-radius:99px;color:#666}.timer{font-weight:750}.workspace{position:relative;flex:1;overflow:hidden}.canvas{position:absolute;inset:0;background:#e9ebef;cursor:grab;overflow:hidden}.canvas.dragging{cursor:grabbing}.world{position:absolute;left:50%;top:46%;width:900px;height:620px;transform-origin:0 0}.paper{position:absolute;inset:0;background:white;box-shadow:0 8px 30px #0001}.grid{position:absolute;inset:-800px;background-image:radial-gradient(#cfd2d8 1px,transparent 1px);background-size:22px 22px}.world svg{position:absolute;width:100%;height:100%}.atom circle{fill:#fff;stroke:#30343d;stroke-width:2}.atom text{font-size:17px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.atom{cursor:grab}.atom:hover circle{stroke:#6c55df;stroke-width:3}.bond{stroke:#30343d;stroke-width:5;stroke-linecap:round}.empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#c1c4cb;font-size:17px;pointer-events:none}.rail{position:absolute;left:10px;top:16px;bottom:16px;width:62px;background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 8px 30px #0001;z-index:10;display:flex;flex-direction:column;align-items:center;padding:8px;gap:7px}.rail .title{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;color:#777;margin:4px}.rail button{width:44px;height:44px;border:0;background:#fff;border-radius:10px;font-size:21px;cursor:pointer}.rail button:hover,.rail button.active{background:#eeebff;color:#6c55df}.drawer{position:absolute;left:80px;top:16px;width:260px;background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 10px 35px #0002;z-index:12;padding:14px;display:none}.drawer.open{display:block}.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.dh b{font-size:14px}.close{border:0;background:#f1f2f5;border-radius:7px;width:28px;height:28px;cursor:pointer}.search{width:100%;padding:9px;border:1px solid #ddd;border-radius:8px;margin-bottom:10px}.items{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:420px;overflow:auto}.item{border:1px solid #ddd;background:#fff;border-radius:9px;padding:10px;cursor:pointer;text-align:center}.item:hover{background:#faf9ff;border-color:#a69ae9}.sym{font-size:22px;font-weight:800;display:block}.item small{color:#777;font-size:11px}.tool{display:flex;gap:10px;align-items:center;border:1px solid #ddd;border-radius:9px;padding:10px;margin-bottom:8px;cursor:pointer}.tool:hover{background:#faf9ff}.status{position:absolute;right:15px;top:15px;background:#fff;border:1px solid #ddd;border-radius:9px;padding:7px 10px;font-size:11px;color:#777;z-index:8}.zoom{position:absolute;right:15px;bottom:24px;background:#fff;border:1px solid #ddd;border-radius:10px;box-shadow:0 8px 25px #0001;display:flex;z-index:9;overflow:hidden}.zoom button{width:37px;height:34px;border:0;background:#fff;cursor:pointer;font-size:17px}.zoom button:hover{background:#f4f4f7}.zoom span{width:52px;display:flex;align-items:center;justify-content:center;font-size:11px;border-left:1px solid #ddd;border-right:1px solid #ddd}.question{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);width:min(650px,calc(100% - 150px));background:#fff;border:1px solid #ddd;border-radius:16px;box-shadow:0 10px 35px #0002;padding:15px 17px;z-index:7}.qtop{display:flex;justify-content:space-between;gap:10px}.tag{font-size:10px;color:#6c55df;font-weight:800;letter-spacing:.1em}.q{font-size:15px;font-weight:750;margin-top:4px}.formula{font-size:12px;color:#777;margin-top:3px}.hint{border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-size:12px}.qb{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.meta{font-size:11px;color:#888}.check{border:0;background:#6c55df;color:#fff;border-radius:9px;padding:10px 16px;font-weight:750;cursor:pointer}.modal{position:absolute;inset:0;background:#0004;display:none;align-items:center;justify-content:center;z-index:50}.modal.show{display:flex}.box{background:#fff;width:370px;border-radius:15px;padding:21px;box-shadow:0 20px 60px #0003}.box h2{margin:0 0 8px;font-size:19px}.box p{font-size:13px;color:#686d78;line-height:1.5}.actions{display:flex;gap:8px}.actions button{flex:1;padding:10px;border-radius:8px;border:1px solid #ddd;cursor:pointer}.primary{background:#6c55df!important;color:white;border-color:#6c55df!important}@media(max-width:700px){.center{display:none}.question{width:calc(100% - 110px)}.drawer{left:78px;width:230px}}
</style></head><body><div class="app"><header class="top"><div class="logo">Chem<b>Build</b></div><div class="center"><span class="pill">Soal 3 / 10</span><span class="timer" id="timer">02:31</span></div><div>⋯</div></header><main class="workspace"><div class="canvas" id="canvas"><div class="world" id="world"><div class="grid"></div><div class="paper"></div><div class="empty" id="empty">Canvas — susun struktur di sini</div><svg id="svg" viewBox="0 0 900 620"></svg></div></div><nav class="rail"><div class="title">KOMPONEN</div><button data-tip="Atom" onclick="openPanel('atom',this)">⚛</button><button data-tip="Ikatan" onclick="openPanel('bond',this)">🔗</button><button data-tip="Cincin" onclick="openPanel('ring',this)">⬡</button><button data-tip="Muatan" onclick="openPanel('charge',this)">±</button><button data-tip="Tools" onclick="openPanel('tools',this)">✦</button><div style="flex:1"></div><button onclick="closePanel()">‹</button></nav><aside class="drawer" id="drawer"><div class="dh"><b id="dtitle">Atom</b><button class="close" onclick="closePanel()">×</button></div><input class="search" id="search" placeholder="Cari komponen..." oninput="filter()"><div id="items"></div></aside><div class="status" id="status">Mode: Select · Zoom 100%</div><div class="zoom"><button onclick="zoomBy(-.1)">−</button><span id="zt">100%</span><button onclick="zoomBy(.1)">+</button><button onclick="resetView()">⌂</button></div><section class="question"><div class="qtop"><div><div class="tag">CHALLENGE</div><div class="q">Buat struktur kimia <b>benzena</b></div><div class="formula">Formula target: C₆H₆ · Cincin aromatik</div></div><button class="hint" onclick="hint()">💡 Hint</button></div><div class="qb"><span class="meta">Drag & drop atau klik komponen untuk menambahkan</span><button class="check" onclick="check()">✓ Check Answer</button></div></section><div class="modal" id="modal"><div class="box"><h2 id="mt">Hint</h2><p id="mp"></p><div class="actions"><button onclick="closeModal()">Tutup</button><button class="primary" onclick="closeModal()">Coba Lagi</button></div></div></div></main></div><script>
const svg=document.getElementById('svg'),canvas=document.getElementById('canvas'),world=document.getElementById('world'),drawer=document.getElementById('drawer'),items=document.getElementById('items'),search=document.getElementById('search');let zoom=1,panX=0,panY=0,atoms=[],bonds=[],drag=null,off={x:0,y:0},pan=false,last={x:0,y:0},mode='select';const data={atom:[['C','Carbon'],['H','Hydrogen'],['O','Oxygen'],['N','Nitrogen'],['S','Sulfur'],['P','Phosphorus'],['F','Fluorine'],['Cl','Chlorine'],['Br','Bromine'],['I','Iodine']],bond:[['─','Single','single'],['═','Double','double'],['≡','Triple','triple'],['⌬','Aromatic','aromatic']],ring:[['△','3-member','r3'],['□','4-member','r4'],['⬟','5-member','r5'],['⬡','6-member','r6'],['⬢','7-member','r7']],charge:[['+','Positive'],['−','Negative'],['2+','Positive 2'],['2−','Negative 2']],tools:[['↖','Select'],['⌫','Delete'],['⊙','Center Canvas']]};let type='atom';function openPanel(t,b){type=t;document.querySelectorAll('.rail button').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawer.classList.add('open');document.getElementById('dtitle').textContent={atom:'Atom',bond:'Ikatan',ring:'Cincin',charge:'Muatan',tools:'Tools'}[t];search.value='';filter()}function closePanel(){drawer.classList.remove('open');document.querySelectorAll('.rail button').forEach(x=>x.classList.remove('active'))}function filter(){let q=search.value.toLowerCase(),a=data[type].filter(x=>(x[0]+' '+x[1]).toLowerCase().includes(q));items.innerHTML='';if(type==='tools'){a.forEach(x=>{let d=document.createElement('div');d.className='tool';d.innerHTML='<b>'+x[0]+'</b><span>'+x[1]+'</span>';d.onclick=()=>{if(x[1]==='Delete')mode='delete';else if(x[1]==='Select')mode='select';else resetView();closePanel();status()};items.appendChild(d)});return}let box=document.createElement('div');box.className='items';a.forEach(x=>{let d=document.createElement('button');d.className='item';d.innerHTML='<span class="sym">'+x[0]+'</span><small>'+x[1]+'</small>';d.onclick=()=>add(type,x);box.appendChild(d)});items.appendChild(box)}function add(t,x){if(t==='atom'){atoms.push({id:Date.now()+Math.random(),el:x[0],x:450+Math.random()*70-35,y:310+Math.random()*70-35});document.getElementById('empty').style.display='none'}else if(t==='ring'){ring(+x[2].slice(1))}else if(t==='bond'){mode=x[2]}closePanel();render();status()}function ring(n){atoms=[];bonds=[];let cx=450,cy=310,r=115;for(let i=0;i<n;i++){let a=-Math.PI/2+i*2*Math.PI/n;atoms.push({id:i,el:'C',x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)})}for(let i=0;i<n;i++)bonds.push({a:i,b:(i+1)%n,order:n===6&&i%2?2:1});document.getElementById('empty').style.display='none'}function render(){svg.innerHTML='';bonds.forEach(b=>{let A=atoms[b.a],B=atoms[b.b];if(!A||!B)return;let dx=B.x-A.x,dy=B.y-A.y,l=Math.hypot(dx,dy),nx=-dy/l,ny=dx/l;for(let i=0;i<b.order;i++){let o=(i-(b.order-1)/2)*8;let e=document.createElementNS('http://www.w3.org/2000/svg','line');e.classList.add('bond');e.setAttribute('x1',A.x+nx*o);e.setAttribute('y1',A.y+ny*o);e.setAttribute('x2',B.x+nx*o);e.setAttribute('y2',B.y+ny*o);svg.appendChild(e)}});atoms.forEach(a=>{let g=document.createElementNS('http://www.w3.org/2000/svg','g');g.classList.add('atom');g.innerHTML='<circle cx="'+a.x+'" cy="'+a.y+'" r="23"/><text x="'+a.x+'" y="'+a.y+'">'+a.el+'</text>';g.onpointerdown=e=>start(e,a,g);svg.appendChild(g)})}function point(e){let r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/zoom,y:(e.clientY-r.top)/zoom}}function start(e,a,g){e.stopPropagation();if(mode==='delete'){atoms=atoms.filter(x=>x!==a);render();return}let p=point(e);drag=a;off={x:a.x-p.x,y:a.y-p.y};g.setPointerCapture(e.pointerId)}svg.onpointermove=e=>{if(!drag)return;let p=point(e);drag.x=p.x+off.x;drag.y=p.y+off.y;render()};svg.onpointerup=()=>drag=null;canvas.onpointerdown=e=>{if(e.target.closest('.atom'))return;pan=true;canvas.classList.add('dragging');last={x:e.clientX,y:e.clientY}};canvas.onpointermove=e=>{if(!pan)return;panX+=e.clientX-last.x;panY+=e.clientY-last.y;last={x:e.clientX,y:e.clientY};apply()};window.onpointerup=()=>{pan=false;canvas.classList.remove('dragging')};canvas.onwheel=e=>{e.preventDefault();zoomBy(e.deltaY<0?.1:-.1)};function zoomBy(v){zoom=Math.max(.5,Math.min(2.5,zoom+v));apply()}function apply(){world.style.transform='translate(calc(-50% + '+panX+'px),calc(-50% + '+panY+'px)) scale('+zoom+')';document.getElementById('zt').textContent=Math.round(zoom*100)+'%';status()}function resetView(){zoom=1;panX=panY=0;apply()}function status(){document.getElementById('status').textContent='Mode: '+mode+' · Zoom '+Math.round(zoom*100)+'%'}function modal(t,p){document.getElementById('mt').textContent=t;document.getElementById('mp').textContent=p;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function hint(){modal('💡 Hint','Benzena memiliki 6 atom karbon yang membentuk cincin. Pada prototype ini gunakan 3 ikatan rangkap yang tersusun bergantian.')}function check(){let c=atoms.filter(a=>a.el==='C').length,db=bonds.filter(b=>b.order===2).length;modal(c===6&&bonds.length===6&&db===3?'🎉 Correct!':'❌ Belum benar',c===6&&bonds.length===6&&db===3?'Struktur dasar benzena sudah sesuai. +100 points.':'Periksa jumlah atom C, bentuk cincin, dan jumlah ikatan rangkap.')}apply();render();
</script></body></html>
